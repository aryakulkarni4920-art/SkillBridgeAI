{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h3 class="mb-0">
                        🔒 Change Password
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-grid gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-danger">

                                Change Password

                            </button>

                            <a href="{% url 'profile' %}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
