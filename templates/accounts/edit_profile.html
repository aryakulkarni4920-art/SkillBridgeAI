{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        ✏️ Edit Profile
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            {{ user_form.username }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            {{ user_form.email }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Profile Picture
                            </label>

                            {{ profile_form.profile_picture }}

                        </div>

                        <div class="d-grid gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Save Changes

                            </button>

                            <a href="{% url 'profile' %}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
