{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="fw-bold mb-4">
        💼 Job Recommendations
    </h2>

    <div class="row">

        {% for job in jobs %}

        <div class="col-lg-6 mb-4">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h4 class="fw-bold">
                        {{ job.title }}
                    </h4>

                    <p class="mb-2">
                        🏢 <strong>{{ job.company }}</strong>
                    </p>

                    <p class="mb-2">
                        📍 {{ job.location }}
                    </p>

                    <p class="mb-3">
                        💰 {{ job.salary }}
                    </p>

                    <a href="{{ job.apply_link }}"
                       target="_blank"
                       class="btn btn-primary">

                        Apply Now →

                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">

            <div class="alert alert-info">

                No jobs available yet.

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
